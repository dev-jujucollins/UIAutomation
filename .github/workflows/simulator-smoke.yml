name: Simulator smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

concurrency:
  group: uiautomation-simulator
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SIMULATOR_CI == 'true'
    runs-on: [self-hosted, macOS, ARM64, uiautomation, xcode-27, ios-27]
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
      UIAUTOMATION_SIMULATOR: UIAutomation CI
      UIAUTOMATION_RUNTIME: "27.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --no-editable --python 3.12
      - name: Check the selected simulator and native tools
        run: >-
          uv run --no-editable uiautomation doctor
          --device-name "$UIAUTOMATION_SIMULATOR" --platform-version "$UIAUTOMATION_RUNTIME"
          --headless-simulator
      - name: Run six simulator smoke cases serially
        run: >-
          uv run --no-editable pytest tests/integration --run-integration
          -m smoke -n 0 --headless-simulator
          --device-name "$UIAUTOMATION_SIMULATOR" --platform-version "$UIAUTOMATION_RUNTIME"
          --timeout=600 --artifacts-dir=artifacts
          --junitxml=reports/simulator.xml --html=reports/simulator.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-smoke-${{ github.run_id }}
          path: |
            artifacts/
            reports/
          retention-days: 14
