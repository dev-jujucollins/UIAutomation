<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Unlabeled Fixture</title>
  <style>button { width: 64px; height: 64px; }</style>
</head>
<body>
  <h1>Unlabeled control fixture</h1>
  <!-- An icon-only button with no text and no aria-label: VoiceOver cannot name it. -->
  <button type="button" id="mystery"></button>
  <button type="button">Labelled</button>
</body>
