[project]
name = "uiautomation"
version = "0.1.0"
description = "iOS Native Apps UI Automation Framework using Appium and Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "UIAutomation" }]

dependencies = [
    "appium-python-client>=3.0.0",
    "selenium>=4.15.0",
]

[project.scripts]
uiautomation = "uiautomation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uiautomation"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.2.0",
    "pytest-html>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
    "pyright>=1.1.390",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "conftest.py"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "real_device(reason): Requires a physical device; skip before fixture setup",
    "journey: Representative navigation round trips",
    "lifecycle: Tests creating and deleting owned data on an explicitly selected simulator",
    "maps_navigation: Starts navigation from Apple Park on an explicitly selected simulator",
    "unit: Tests requiring no device or Appium server",
    "integration: Tests requiring an iOS target",
    "diagnostic: Environment-dependent observations",
    "settings: Tests for the Settings app",
    "safari: Tests for Safari browser",
    "contacts: Tests for Contacts app",
    "calendar: Tests for Calendar app",
    "maps: Tests for Maps search and route previews",
    "messages: Tests for Messages app drafts and navigation",
    "photos: Tests for Photos app",
    "smoke: Smoke tests (quick sanity checks)",
    "regression: Full regression tests",
    "slow: Tests that take a long time to run",
    "onboarding: Tests for first-time app launch onboarding screens",
]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
addopts = "-ra --tb=short --strict-markers"
console_output_style = "classic"
timeout = 120

[tool.coverage.run]
branch = true
source = ["uiautomation"]

[tool.coverage.report]
show_missing = true
